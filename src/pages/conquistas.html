<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas conquistas - Heróis da Saúde</title>
  <!-- O emblema do jogo na aba. O SVG serve a quase todo navegador;
       o PNG de 32 cobre os antigos, e o de 180 e o atalho do iPhone,
       que vem sem canto arredondado porque o iOS recorta sozinho. -->
  <link rel="icon" href="../imgs/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="../imgs/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="../imgs/apple-touch-icon.png" />
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/progresso.css">
  <script src="/vendor/supabase.js"></script>
  <script src="../js/supabase.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/conquista-aviso.js" defer></script>
  <script src="../js/navbar.js" defer></script>
  <script src="../js/conquistas.js" defer></script>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="page-wrap">

    <nav class="nav_bar" data-navbar></nav>

    <main class="main-content">

      <div class="welcome-bar">
        <div class="welcome-text">
          <h2>Minhas conquistas</h2>
          <p id="estante-subtitulo">Sua estante de insígnias.</p>
        </div>
      </div>

      <p class="turmas-erro" id="estante-erro" hidden></p>

      <div class="dashboard-grid">
        <div class="col-full">

          <section class="nivel-faixa" id="bloco-nivel" hidden>
            <div class="nivel-faixa__selo">
              <span class="nivel-faixa__num" id="nivel-num">—</span>
              <span class="nivel-faixa__rot">nível</span>
            </div>

            <div class="nivel-faixa__meio">
              <h3 class="nivel-faixa__titulo" id="nivel-titulo"></h3>
              <span class="nivel-faixa__barra"><i id="nivel-barra"></i></span>
              <p class="nivel-faixa__nota" id="nivel-nota"></p>
            </div>

            <div class="nivel-faixa__xp">
              <span class="nivel-faixa__xpnum" id="nivel-xp">—</span>
              <span class="nivel-faixa__rot">XP total</span>
            </div>
          </section>

          <section class="dashboard-section">
            <h3>Estante</h3>
          </section>

          <section class="painel">
            <p class="temas-intro" id="estante-contagem"></p>

            <div class="estante" id="estante"></div>

            <div class="empty-state" id="estante-vazia" hidden>
              <div class="empty-state__icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 4h8v5a4 4 0 01-8 0V4z" />
                  <path d="M8 6H5v1a3 3 0 003 3M16 6h3v1a3 3 0 01-3 3" />
                  <path d="M10 17h4M12 13v4M9 20h6" />
                </svg>
              </div>
              <p class="empty-state__title">A estante ainda está sendo montada</p>
              <p class="empty-state__hint" id="estante-vazia-dica">
                As insígnias chegam em breve.
              </p>
            </div>
          </section>

        </div>
      </div>
    </main>
  </div>

  <!-- O detalhe de uma insígnia, aberto ao clicar numa peça da estante.
       Preenchido por conquistas.js. -->
  <div class="modal" id="modal-insignia" hidden>
    <div class="modal__caixa modal__caixa--estreita detalhe-insignia" role="dialog" aria-modal="true"
      aria-labelledby="detalhe-nome">
      <div class="modal-header">
        <span class="detalhe-insignia__estado" id="detalhe-estado"></span>
        <button type="button" class="modal__fechar" id="detalhe-fechar" aria-label="Fechar">&times;</button>
      </div>

      <div class="detalhe-insignia__topo">
        <div class="detalhe-insignia__arte" id="detalhe-arte"></div>
        <h3 class="detalhe-insignia__nome" id="detalhe-nome"></h3>
        <p class="detalhe-insignia__descricao" id="detalhe-descricao"></p>
        <span class="detalhe-insignia__xp" id="detalhe-xp"></span>
      </div>

      <div class="detalhe-insignia__como">
        <h4>Como conquistar</h4>
        <p id="detalhe-como"></p>

        <div class="detalhe-insignia__progresso" id="detalhe-progresso" hidden>
          <span class="detalhe-insignia__barra"><i id="detalhe-barra"></i></span>
          <span class="detalhe-insignia__conta" id="detalhe-conta"></span>
        </div>
      </div>

      <ol class="detalhe-insignia__escada" id="detalhe-escada" hidden></ol>
    </div>
  </div>
</body>

</html>
