<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hérios da Saúde</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="js/dashboard.js" defer></script>
    <style>

      /* Estrutura Geral */
        html, body {min-height: 100%;}
    
        .page-wrap{
          display: flex;
          flex-direction: column;
          min-height: 100vh;
        }
        .main-content{
          flex: 1;
          padding: 36px 24px 60px;
          max-width: 1200px;
          margin: 0 auto;
          width: 100%;
        }
        .dashboard-grid {
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          grid-template-rows: auto;
          gap: 20px;
        }

        .col-full  { grid-column: 1 / -1; }
        .col-2     { grid-column: span 2; }
        .col-1     { grid-column: span 1; }

      /* Barra de Boas-vindas */
        .welcome-bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px
        }
        .welcome-text h2{
          font-family: var(--font-display);
          font-size: 26px;
          font-weight: 900;
          color: #fff;
          margin: 0;
         line-height: 1.2;
        }
        .welcome-badge{
          display: flex;
          align-items: center;
          gap: 8px;
          background-color: rgba(255, 255, 255, 0.08);
          padding: 6px 12px;
          border-radius: 20px;
          box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1);
        }
        #welcome-message{
          font-size: 14px;
          color: rgba(255, 255, 255, 0.55);
          margin: 4px 0 0;
        }
        #btn-nova-turma{
          padding: 8px 16px;
          border-radius: 20px;
          background-color: #0ea596;
          color: #fff;
          font-size: 14px;
          border: none;
          cursor: pointer;
          box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1);
          transition: transform 0.3s ease, box-shadow 0.2s ease;
           margin-top: 15px; 
        }
        #btn-nova-turma:hover{
          background-color: #159D8A;
          transform: translateY(-2px);
          box-shadow: 5px 10px 15px rgba(0, 0, 0, 0.2);
        }

        /* Barra de Navegação */
        .topLine{
            background-color: rgba(7, 55, 62, 0.85);;
            padding: 7px;
            border-radius:10px;
            position: static;
            top: 0;
            z-index: 100;
            box-shadow: 0 20px 20px rgba(0, 0, 0, 0.08);
        }

        .turmas{
            font-size: 20px;
            font-weight: 500;
            background-color: #014B43;
            padding: 5px;
            text-align: center;
            border-radius: 20px;

        }
        .turmas:hover{
            background-color: #159D8A;
        }
        .quizes{
            font-size: 20px;
            font-weight: 500;
            background-color: #014B43;
            padding: 5px;
            text-align: center;
            border-radius: 20px;

        }
        .quizes:hover{
            background-color: #159D8A;
        }
        .perssonalizar{
            font-size: 20px;
            font-weight: 500;
            background-color: #014B43;
            padding: 10px;
            text-align: center;
            border-radius: 20px;

        }
        .perssonalizar:hover{
            background-color: #159D8A;
        }
        .perfil{
            font-size: 20px;
            font-weight: 500;
            background-color: #014B43;
            padding: 5px;
            text-align: center;
            border-radius: 20px;
        }
        .perfil:hover{
            background-color: #159D8A;
            
        }
      .btn-logout {
       background: none;
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 8px;
        padding: 6px 14px;
        color: rgba(255,255,255,0.55);
        font-size: 13px;
        font-family: var(--font-body);
        cursor: pointer;
        transition: all .2s;
      }

    .btn-logout:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.3);
    } 
 
    </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div style="position:fixed;top:8%;left:4%;pointer-events:none;z-index:0;color:rgba(107,223,184,0.12);animation:float 7s ease-in-out infinite;">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="2" width="6" height="20" rx="2"/><rect x="2" y="9" width="20" height="6" rx="2"/></svg>
  </div>
  <div style="position:fixed;top:80%;right:4%;pointer-events:none;z-index:0;color:rgba(107,223,184,0.1);animation:float2 9s ease-in-out infinite 2s;">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L3 7v5c0 5.25 3.75 10.17 9 11.33C17.25 22.17 21 17.25 21 12V7l-9-5z"/></svg>
  </div>

  <div class="page-wrap">


<!-- ── Basicamente nav quer dizer navegação, então acho uma boa delimitar meu escopo
de navegação aqui e deparar tudo entre Barra e conteudo── -->
    <nav class="nav_bar">
    <div class="topLine">
       <div class="navbar__inner">
        <div class="navbar__logo">
          <div class="navbar__logo-dot">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </div>
          HERÓIS DA SAÚDE
        </div>

        <div style="display:flex;align-items:center;gap:20px;">
          <ul class="navbar__links">
            <li><a href="missao.html"> Turmas</a></li>
            <li><a href="mapa.html"> Quizes</a></li>
          </ul>

          <ul class="navbar__links" style="border-left:1px solid rgba(255,255,255,0.14);padding-left:20px;">
            <li><a href="mapa.html"> Mapa</a></li>
            <li><a href="missao.html"> Missões</a></li>
            <li><a href="#"> Ranking</a></li>
          </ul>

          <div style="display:flex;align-items:center;gap:12px;">
            <div class="xp-badge" id="nav-xp"> ⭐ 480 XP </div>
            <button id="logout-btn" class="btn-logout">Sair</button>
          </div>
        </div>
      </div>
      </div>
  </nav>

  <main class="main-content">

    <div class="welcome-bar">
    <div class="welcome-text">
        <h2>Bem-vindo(a) ao Dashboard!  <span id="user-name">—</span></h2>
        <p style id="welcome-message">Segunda-feira, 18 de agosto de 2026</p>
        <button id="btn-nova-turma">+ Criar nova turma</button>
  </div>
  <div class="welcome-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#f9c74f">
            <path d="M12 2L3 7v5c0 5.25 3.75 10.17 9 11.33C17.25 22.17 21 17.25 21 12V7l-9-5z"/>
          </svg>
          <span>Nível <span id="user-level">5</span> · Mestre da Saúde</span>
        </div>
      </div>

  <div class="dashboard-grid">



       </div>
   </main>
  </div>

</body>
</html>
