<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Hérios da Saúde</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script src="../js/dashboard.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div
    style="position:fixed;top:8%;left:4%;pointer-events:none;z-index:0;color:rgba(107,223,184,0.12);animation:float 7s ease-in-out infinite;">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
      <rect x="9" y="2" width="6" height="20" rx="2" />
      <rect x="2" y="9" width="20" height="6" rx="2" />
    </svg>
  </div>
  <div
    style="position:fixed;top:80%;right:4%;pointer-events:none;z-index:0;color:rgba(107,223,184,0.1);animation:float2 9s ease-in-out infinite 2s;">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2L3 7v5c0 5.25 3.75 10.17 9 11.33C17.25 22.17 21 17.25 21 12V7l-9-5z" />
    </svg>
  </div>

  <div class="page-wrap">


    <!-- ── Basicamente nav quer dizer navegação, então acho uma boa delimitar meu escopo
de navegação aqui e deparar tudo entre Barra e conteudo── -->
    <nav class="nav_bar">
      <div class="topLine">
        <div class="navbar__inner">
          <div class="navbar__logo">
            <div class="navbar__logo-dot">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff">
                <path
                  d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
              </svg>
            </div>
            HERÓIS DA SAÚDE
          </div>

          <div style="display:flex;align-items:center;gap:20px;">
            <ul class="navbar__links">
              <li><a href="missao.html"> Turmas</a></li>
              <li><a href="mapa.html"> Quizes</a></li>
            </ul>

            <ul class="navbar__links" style="border-left:1px solid rgba(255,255,255,0.14);padding-left:20px;">
              <li><a href="mapa.html"> Mapa</a></li>
              <li><a href="missao.html"> Missões</a></li>
              <li><a href="#"> Ranking</a></li>
            </ul>

            <div style="display:flex;align-items:center;gap:12px;">
              <div class="xp-badge" id="nav-xp"> ⭐ 480 XP </div>
              <button id="logout-btn" class="btn-logout">Sair</button>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <main class="main-content">

      <div class="welcome-bar">
        <div class="welcome-text">
          <h2>Bem-vindo(a) ao Dashboard! <span id="user-name">—</span></h2>
          <p style id="welcome-message">Segunda-feira, 18 de agosto de 2026</p>
          <button id="btn-nova-turma">+ Criar nova turma</button>
        </div>
        <div class="welcome-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#f9c74f">
            <path d="M12 2L3 7v5c0 5.25 3.75 10.17 9 11.33C17.25 22.17 21 17.25 21 12V7l-9-5z" />
          </svg>
          <span>Nível <span id="user-level">5</span> · Mestre da Saúde</span>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="col-full">
          <section class="dashboard-section">
            <h3>Minhas Turmas:</h3>
          </section>
          <section class="painel">

            <div class="lista-turmas" id="lista-turmas">
              <!-- Turmas inseridas via JavaScript -->
            </div>

            <div class="empty-state" id="empty-turmas">
              <div class="empty-state__icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <path d="M19 8v6M22 11h-6" />
                </svg>
              </div>
              <p class="empty-state__title">Você ainda não possui turmas</p>
              <p class="empty-state__hint">Clique em “+ Criar nova turma” para começar.</p>
            </div>

          </section>
    </main>
  </div>

</body>

</html>
