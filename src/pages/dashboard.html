<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Hérios da Saúde</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script src="/vendor/supabase.js"></script>
  <script src="../js/supabase.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/navbar.js" defer></script>
  <script src="../js/questoes-ui.js" defer></script>
  <script src="../js/quiz-modal.js" defer></script>
  <script src="../js/dashboard.js" defer></script>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>


  <div class="fundo-vivo" aria-hidden="true">
    <span style="--x:8%;  --tam:14px; --dur:19s; --atraso:0s"></span>
    <span style="--x:22%; --tam:8px;  --dur:24s; --atraso:3s"></span>
    <span style="--x:37%; --tam:18px; --dur:16s; --atraso:6s"></span>
    <span style="--x:54%; --tam:10px; --dur:27s; --atraso:1s"></span>
    <span style="--x:68%; --tam:15px; --dur:21s; --atraso:8s"></span>
    <span style="--x:81%; --tam:7px;  --dur:18s; --atraso:4s"></span>
    <span style="--x:93%; --tam:12px; --dur:25s; --atraso:11s"></span>
  </div>

  <div
    style="position:fixed;top:8%;left:4%;pointer-events:none;z-index:0;color:rgba(107,223,184,0.12);animation:float 7s ease-in-out infinite;">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
      <rect x="9" y="2" width="6" height="20" rx="2" />
      <rect x="2" y="9" width="20" height="6" rx="2" />
    </svg>
  </div>
  <div
    style="position:fixed;top:80%;right:4%;pointer-events:none;z-index:0;color:rgba(107,223,184,0.1);animation:float2 9s ease-in-out infinite 2s;">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2L3 7v5c0 5.25 3.75 10.17 9 11.33C17.25 22.17 21 17.25 21 12V7l-9-5z" />
    </svg>
  </div>

  <div class="page-wrap">


    <nav class="nav_bar" data-navbar></nav>

    <main class="main-content">

      <div class="welcome-bar">
        <div class="welcome-text">
          <h2>Bem-vindo(a) ao Dashboard! <span id="user-name">—</span></h2>
          <p id="welcome-message">Segunda-feira, 18 de agosto de 2026</p>
          <button id="btn-nova-turma">+ Criar nova turma</button>
        </div>
        <div data-nivel></div>
      </div>

      <div class="dashboard-grid">
        <div class="col-full">
          <section class="dashboard-section">
            <h3>Minhas Turmas:</h3>
          </section>
          <section class="painel">

            <div class="lista-turmas" id="lista-turmas">
            </div>

            <div class="empty-state" id="empty-turmas">
              <div class="empty-state__icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <path d="M19 8v6M22 11h-6" />
                </svg>
              </div>
              <p class="empty-state__title">Você ainda não possui turmas</p>
              <p class="empty-state__hint">Clique em “+ Criar nova turma” para começar.</p>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <div class="modal" id="modal-turma" hidden>
    <div class="modal__caixa" role="dialog" arial-model="true" aria-labelledby="modal-turma-title"
      aria-describedby="modal-turma-desc">
      <div class="modal-header">
        <h3 id="modal-titulo">Nova turma</h3>
        <button class="modal__fechar" id="btn-fechar" aria-label="Fechar">&times;</button>
      </div>
      <label class="campo">
        <span class="campo__label">Nome da turma</span>
        <input type="text" id="in-nome" placeholder="7º ano B" maxlength="30" autocomplete="off">
      </label>

      <label class="campo">
        <span class="campo__label">Ano escolar</span>
        <select id="in-ano">
          <optgroup label="Ensino Fundamental">
            <option value="1º ano">1º ano</option>
            <option value="2º ano">2º ano</option>
            <option value="3º ano">3º ano</option>
            <option value="4º ano">4º ano</option>
            <option value="5º ano">5º ano</option>
            <option value="6º ano">6º ano</option>
            <option value="7º ano">7º ano</option>
            <option value="8º ano">8º ano</option>
            <option value="9º ano">9º ano</option>
          </optgroup>
          <optgroup label="Ensino Médio">
            <option value="1º ano EM">1º ano</option>
            <option value="2º ano EM">2º ano</option>
            <option value="3º ano EM">3º ano</option>
          </optgroup>
        </select>
      </label>

      <div class="campo">
        <span class="campo__label">Cor da turma</span>
        <div class="cores" id="seletor-cores">
          <button type="button" class="cor cor--ativa" data-cor="#14b8a6" style="--c:#14b8a6"
            aria-label="Verde"></button>
          <button type="button" class="cor" data-cor="#3b82f6" style="--c:#3b82f6" aria-label="Azul"></button>
          <button type="button" class="cor" data-cor="#f9c74f" style="--c:#f9c74f" aria-label="Amarelo"></button>
          <button type="button" class="cor" data-cor="#f472b6" style="--c:#f472b6" aria-label="Rosa"></button>
          <button type="button" class="cor" data-cor="#a78bfa" style="--c:#a78bfa" aria-label="Roxo"></button>
          <button type="button" class="cor" data-cor="#fb923c" style="--c:#fb923c" aria-label="Laranja"></button>
        </div>
      </div>
      <p class="modal__erro" id="modal-erro" hidden></p>

      <div class="modal__acoes">
        <button class="btn-ghost" id="btn-cancelar">Cancelar</button>
        <button class="btn-primary" id="btn-salvar">Criar turma</button>
      </div>
    </div>
  </div>


  <div class="menu-turma" id="menu-turma" role="menu" hidden>
    <p class="menu-turma__titulo" id="menu-turma-nome">Turma</p>

    <button type="button" class="menu-turma__item" data-acao="info" role="menuitem">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        <path d="M3 3v18h18" />
        <path d="M7 15l4-5 3 3 5-7" />
      </svg>
      Informações da turma
    </button>

    <button type="button" class="menu-turma__item" data-acao="editar" role="menuitem">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
      </svg>
      Editar turma
    </button>

    <button type="button" class="menu-turma__item" data-acao="quiz" role="menuitem">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        <circle cx="12" cy="12" r="9" />
        <path d="M9.2 9a2.9 2.9 0 0 1 5.6 1c0 2-2.8 2.4-2.8 4" />
        <path d="M12 17.5h.01" />
      </svg>
      Criar quiz
    </button>

    <span class="menu-turma__risco"></span>

    <button type="button" class="menu-turma__item menu-turma__item--perigo" data-acao="excluir" role="menuitem">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" />
      </svg>
      Desfazer turma
    </button>
  </div>


  <div class="modal" id="modal-confirma" hidden>
    <div class="modal__caixa modal__caixa--estreita" role="dialog" aria-labelledby="confirma-titulo">
      <div class="modal-header">
        <h3 id="confirma-titulo">Desfazer turma</h3>
        <button class="modal__fechar" id="confirma-fechar" aria-label="Fechar">&times;</button>
      </div>

      <p class="modal__texto" id="confirma-texto"></p>
      <p class="modal__erro" id="confirma-erro" hidden></p>

      <div class="modal__acoes">
        <button class="btn-ghost" id="confirma-nao">Manter turma</button>
        <button class="btn-perigo" id="confirma-sim">Desfazer</button>
      </div>
    </div>
  </div>
</body>

</html>
