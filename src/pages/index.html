<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heróis da Saúde — Login</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .login-page::before {
      content: '';
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 80vw;
      max-width: 700px;
      max-height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(46,196,169,0.07) 0%, transparent 65%);
      pointer-events: none;
    }

    .logo-icon-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      background: linear-gradient(145deg, #2ec4a9, #1a9e8a);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(46,196,169,0.45);
      margin-bottom: 4px;
    }

    .logo-icon-wrap svg { animation: heartbeat 1.8s ease-in-out infinite; }
    .logo-ring {
      position: absolute;
      inset: -5px;
      border: 2px solid rgba(107,223,184,0.45);
      border-radius: 25px;
      animation: pulse-ring 2s ease-out infinite;
    }
    .logo-star {
      position: absolute; top: -4px; right: -4px; width: 22px; height: 22px;
      background: linear-gradient(135deg, #f9c74f, #f4a01e);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(249,199,79,0.5); font-size: 10px;
    }

    .logo-title {
      font-family: var(--font-display, sans-serif);
      font-size: 26px; font-weight: 900; color: #fff;
      letter-spacing: -0.3px; text-shadow: 0 2px 16px rgba(46,196,169,0.4);
      line-height: 1.1; margin: 0;
    }
    .logo-sub { font-size: 13px; font-weight: 500; color: rgba(107,223,184,0.85); margin-top: 4px; }

    .ecg-wrap { width: 100%; height: 32px; margin-top: 14px; }
    .ecg-path {
      stroke-dasharray: 400; stroke-dashoffset: 400;
      animation: ecg-draw 2.6s ease-out forwards 0.7s;
    }
    @keyframes ecg-draw { to { stroke-dashoffset: 0; } }

    .login-card {
      position: relative; z-index: 1; width: 100%; max-width: 430px;
      background: rgba(255,255,255,0.10); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255,255,255,0.18); border-radius: 32px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.35); padding: 44px 40px 40px;
      animation: slide-up 0.6s ease-out forwards;
    }

    .form { display: flex; flex-direction: column; gap: 16px; }
    .field-label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(107,223,184,0.8); margin-bottom: 6px; }
    .field-wrap { position: relative; }
    .field-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); pointer-events: none; color: rgba(107,223,184,0.6); display: flex; align-items: center; transition: color 0.2s; }
    
    .field-input {
      width: 100%; background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 14px; padding: 12px 44px 12px 42px; font-size: 14px; font-family: var(--font-body, sans-serif);
      color: #fff; outline: none; transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
      box-sizing: border-box;
    }
    .field-input::placeholder { color: rgba(255,255,255,0.38); }
    .field-input:focus { border-color: #6bdfb8; background: rgba(255,255,255,0.13); box-shadow: 0 0 0 3px rgba(107,223,184,0.18); }
    .field-input:focus ~ .field-icon { color: #6bdfb8; }

    .toggle-pass {
      position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: rgba(107,223,184,0.5);
      display: flex; align-items: center; padding: 0; transition: color 0.2s;
    }
    .toggle-pass:hover { color: #6bdfb8; }

    .forgot-row { display: flex; justify-content: flex-end; margin-top: -6px; }
    .forgot-link { font-size: 12px; font-weight: 500; color: rgba(107,223,184,0.7); background: none; border: none; cursor: pointer; transition: color 0.2s; padding: 0; font-family: var(--font-body, sans-serif); }
    .forgot-link:hover { color: #6bdfb8; text-decoration: underline; }

    .btn-submit {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(135deg, #2ec4a9 0%, #1a9e8a 50%, #159d8a 100%);
      border: none; border-radius: 14px; padding: 14px 24px; color: #fff;
      font-family: var(--font-display, sans-serif); font-weight: 700; font-size: 15px;
      letter-spacing: 0.3px; cursor: pointer; box-shadow: 0 4px 20px rgba(46,196,169,0.4);
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s; margin-top: 4px;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(46,196,169,0.55); }
    .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    .xp-row { display: flex; justify-content: center; margin-top: 18px; color: #fff; font-size: 12px; }
    .register-row { text-align: center; font-size: 13px; color: rgba(255,255,255,0.48); font-family: var(--font-body, sans-serif); }
    .register-link { font-weight: 700; color: #6bdfb8; background: none; border: none; cursor: pointer; font-family: inherit; font-size: inherit; padding: 0; transition: opacity 0.2s; }
    .register-link:hover { text-decoration: underline; }

    /* O visual do alerta vem de .alert / .alert--error / .alert--success em style.css.
       Aqui só o espaçamento dentro do card. */
    #form-alert { margin-bottom: 16px; }

    .spin { width: 17px; height: 17px; border: 2.5px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    
    .hidden { display: none !important; }
    
    
    .role-toggle { display: flex; gap: 10px; margin-bottom: 4px; }
    .role-option { flex: 1; position: relative; }
    .role-option input { display: none; }
    .role-label {
      display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px;
      background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 12px; color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.25s; box-sizing: border-box;
    }
    .role-option input:checked + .role-label {
      background: rgba(107,223,184,0.15); border-color: #6bdfb8; color: #6bdfb8; box-shadow: 0 0 12px rgba(107,223,184,0.2);
    }

    select.field-input {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2214%22%20height%3D%228%22%20viewBox%3D%220%200%2014%208%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M1%201L7%207L13%201%22%20stroke%3D%22%236bdfb8%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat; background-position: right 16px center; background-size: 12px; padding-right: 40px;
    }
    select.field-input option { background: #1a2332; color: #fff; padding: 10px; }

    select.field-input:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Esconde as setinhas do input[type=number] — a idade é digitada, não incrementada */
    input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    /* Agrupamento de campos na mesma linha (Ex: Idade e Turma) */
    .form-row { display: flex; gap: 12px; }
    .form-row > div { flex: 1; }

    /* Empilhamento vertical dos campos de um mesmo perfil */
    .field-group { display: flex; flex-direction: column; gap: 16px; }

    .field-hint { font-size: 12px; color: rgba(255,255,255,0.45); margin: 6px 0 0; min-height: 15px; }
    .field-hint.ok  { color: #6bdfb8; }
    .field-hint.err { color: #ff8080; }

    .mode-switch-row { display: flex; justify-content: flex-end; }

    @media (max-width: 480px) {
      .login-card { padding: 32px 22px 28px; }
      .logo-title { font-size: 22px; }
      .form-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <main class="login-page">
    <div class="login-card">

      <!-- Logo -->
      <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:28px;">
        <div class="logo-icon-wrap">
          <div class="logo-ring"></div>
          <svg width="38" height="38" viewBox="0 0 24 24" fill="#fff">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <h1 class="logo-title">HERÓIS DA SAÚDE</h1>
        <p class="logo-sub" id="logo-sub">Sua missão de saúde começa aqui</p>
        
        <div class="ecg-wrap">
          <svg viewBox="0 0 280 40" fill="none" width="100%" preserveAspectRatio="none">
            <polyline class="ecg-path" points="0,20 30,20 40,6 52,34 62,20 74,20 88,3 100,37 112,20 122,20 152,20 162,11 172,29 182,20 210,20 222,8 234,32 244,20 280,20" stroke="#6bdfb8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
      </div>

      <div class="alert" id="form-alert" role="alert" style="display:none"></div>


      <form class="form" id="main-form" novalidate>

        <!-- [NOVO] Toggle de Perfil (Oculto no Login) -->
        <div id="box-role" class="role-toggle hidden">
          <label class="role-option">
            <input type="radio" name="tipo" value="ALUNO" checked>
            <span class="role-label">Sou Aluno</span>
          </label>
          <label class="role-option">
            <input type="radio" name="tipo" value="PROFESSOR">
            <span class="role-label">Sou Professor</span>
          </label>
        </div>

        <!-- [NOVO] Nome (Oculto no Login) -->
        <div id="box-nome" class="hidden">
          <label class="field-label" for="nome">Nome Completo</label>
          <div class="field-wrap">
            <input class="field-input" type="text" id="nome" name="nome" placeholder="Seu nome real" autocomplete="name" />
            <span class="field-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
          </div>
        </div>

        <!-- E-mail (Visível em ambos) -->
        <div>
          <label class="field-label" for="email">E-mail</label>
          <div class="field-wrap">
            <input class="field-input" type="email" id="email" name="email" placeholder="heroi@saude.com" autocomplete="email" required />
            <span class="field-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Senha (Visível em ambos) -->
        <div>
          <label class="field-label" for="password">Senha</label>
          <div class="field-wrap">
            <input class="field-input" type="password" id="password" name="password" placeholder="••••••••" required />
            <span class="field-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- [NOVO] Campos Específicos de Aluno (Ocultos no Login) -->
        <div id="box-aluno" class="field-group hidden">

          <!-- Idade digitada livremente e validada no JS (7 a 18, faixa do jogo) -->
          <div>
            <label class="field-label" for="idade">Idade</label>
            <div class="field-wrap">
              <input class="field-input" type="number" id="idade" name="idade"
                     min="7" max="18" step="1" inputmode="numeric" placeholder="Ex: 12" />
              <span class="field-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              </span>
            </div>
            <p class="field-hint" id="idade-hint"></p>
          </div>

          <!-- Modo A: cascata Escola -> Turma. As turmas só carregam depois da escola. -->
          <div id="modo-selecao" class="field-group">
            <div>
              <label class="field-label" for="escola-aluno">Escola</label>
              <div class="field-wrap">
                <select class="field-input" id="escola-aluno" name="escola_aluno">
                  <option value="" disabled selected>Carregando escolas...</option>
                </select>
                <span class="field-icon">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </span>
              </div>
            </div>
            <div>
              <label class="field-label" for="turma">Turma</label>
              <div class="field-wrap">
                <select class="field-input" id="turma" name="turma" disabled>
                  <option value="" disabled selected>Selecione a escola primeiro</option>
                </select>
                <span class="field-icon">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                </span>
              </div>
            </div>
          </div>

          <!-- Modo B: código entregue pelo professor, resolve escola e turma de uma vez -->
          <div id="modo-codigo" class="hidden">
            <label class="field-label" for="codigo-turma">Código da turma</label>
            <div class="field-wrap">
              <input class="field-input" type="text" id="codigo-turma" name="codigo_turma"
                     placeholder="Ex: 7B-K3M9" maxlength="12" autocomplete="off" autocapitalize="characters" />
              <span class="field-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
              </span>
            </div>
            <p class="field-hint" id="codigo-hint">Peça o código ao seu professor.</p>
          </div>

          <div class="mode-switch-row">
            <button type="button" class="forgot-link" id="btn-modo-turma">Tenho um código da turma</button>
          </div>
        </div>

        <!-- [NOVO] Campos Específicos de Professor (Ocultos por padrão) -->
        <div id="box-professor" class="field-group hidden">
          <div>
            <label class="field-label" for="escola">Escola de Atuação</label>
            <div class="field-wrap">
              <select class="field-input" id="escola" name="escola">
                <option value="" disabled selected>Carregando escolas...</option>
              </select>
              <span class="field-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
              </span>
            </div>
          </div>

          <!-- Aparece só quando o professor escolhe "+ Cadastrar Nova Escola" -->
          <div id="box-nova-escola" class="hidden">
            <label class="field-label" for="nova-escola">Nome da nova escola</label>
            <div class="field-wrap">
              <input class="field-input" type="text" id="nova-escola" name="nova_escola"
                     placeholder="Ex: Colégio Santa Maria" maxlength="150" />
              <span class="field-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
              </span>
            </div>
            <p class="field-hint">Depois de criar a conta, cadastre as turmas no seu painel.</p>
          </div>
        </div>

        <!-- Esqueci senha (Apenas no Login) -->
        <div class="forgot-row" id="forgot-row">
          <button type="button" class="forgot-link">Esqueci minha senha</button>
        </div>

        <!-- Botão Principal -->
        <button type="submit" class="btn-submit" id="submit-btn">
          <span id="btn-label">Entrar no Jogo</span>
        </button>

      </form>

      <!-- Divisor e Alternador de Tela -->
      <div class="divider" style="margin:20px 0 16px"><span>ou</span></div>
      
      <p class="register-row">
        <span id="toggle-text">Novo herói?</span> 
        <button type="button" class="register-link" id="toggle-mode-btn">Criar conta gratuita</button>
      </p>

      <div class="xp-row" id="xp-badge">⭐ Ganhe +50 XP ao fazer login hoje!</div>

    </div>
  </main>

  <!-- Script para alternar Login / Cadastro no front-end -->
  <!-- api.js primeiro: auth.js consome o objeto global API -->
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
