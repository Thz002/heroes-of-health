<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heróis da Saúde — Login</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    /* ── Página de Login ── */
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Blob decorativo extra no centro */
    .login-page::before {
      content: '';
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 80vw;
      max-width: 700px;
      max-height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(46,196,169,0.07) 0%, transparent 65%);
      pointer-events: none;
    }

    /* ── Logo ── */
    .logo-icon-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      background: linear-gradient(145deg, #2ec4a9, #1a9e8a);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(46,196,169,0.45);
      margin-bottom: 4px;
    }

    .logo-icon-wrap svg {
      animation: heartbeat 1.8s ease-in-out infinite;
    }

    .logo-ring {
      position: absolute;
      inset: -5px;
      border: 2px solid rgba(107,223,184,0.45);
      border-radius: 25px;
      animation: pulse-ring 2s ease-out infinite;
    }

    .logo-star {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, #f9c74f, #f4a01e);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(249,199,79,0.5);
      font-size: 10px;
    }

    .logo-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.3px;
      text-shadow: 0 2px 16px rgba(46,196,169,0.4);
      line-height: 1.1;
      margin: 0;
    }

    .logo-sub {
      font-size: 13px;
      font-weight: 500;
      color: rgba(107,223,184,0.85);
      margin-top: 4px;
    }

    /* ── ECG ── */
    .ecg-wrap {
      width: 100%;
      height: 32px;
      margin-top: 14px;
    }

    /* A caneta anda, o papel fica parado.

       `stroke-dasharray: 460` divide a linha em um traço de 460 e um
       vazio de 460 — e o traçado inteiro mede 447, então em qualquer
       instante a tela mostra um pedaço de um ou do outro. Mexer no
       `stroke-dashoffset` é deslizar esse par ao longo do caminho:

         offset  460   o vazio está sobre o traçado    -> tela limpa
         offset    0   o traço está sobre o traçado    -> linha inteira
         offset -460   o vazio voltou                  -> tela limpa

       Indo de 460 a -460 sem pausa, a linha é escrita da esquerda
       para a direita e depois sai pela esquerda, igual ao papel
       passando embaixo da caneta. E como começo e fim do ciclo são o
       mesmo estado (tela limpa), a volta ao início não pisca.

       Os 3 batimentos levam 2,7s para serem escritos — 0,9s cada, que
       dá ~67 por minuto, um coração em repouso. A limpeza é mais
       rápida, 1,8s, porque nela não acontece nada de novo e esticá-la
       só deixaria a tela vazia por mais tempo. */
    .ecg-path {
      stroke-dasharray: 460;
      stroke-dashoffset: 460;
      animation: ecg-traco 4.5s linear infinite 0.5s;
    }

    @keyframes ecg-traco {
      0%   { stroke-dashoffset:  460; }   /* limpo */
      60%  { stroke-dashoffset:    0; }   /* escrito */
      100% { stroke-dashoffset: -460; }   /* limpo de novo */
    }

    /* Quem pede menos movimento no sistema recebe o traçado parado e
       inteiro. Animação que não para é a que mais incomoda quem tem
       sensibilidade vestibular, e esta ficaria rodando o tempo todo
       atrás de um formulário de login. */
    @media (prefers-reduced-motion: reduce) {
      .ecg-path { animation: none; stroke-dashoffset: 0; }
    }

    /* ── Login card ── */
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 32px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.35);
      padding: 44px 40px 40px;
      animation: slide-up 0.6s ease-out forwards;
    }

    /* ── Form ── */
    .form { display: flex; flex-direction: column; gap: 16px; }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(107,223,184,0.8);
      margin-bottom: 6px;
    }

    .field-wrap { position: relative; }

    .field-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: rgba(107,223,184,0.6);
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .field-input {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      padding: 12px 44px 12px 42px;
      font-size: 14px;
      font-family: var(--font-body);
      color: #fff;
      outline: none;
      transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    }

    .field-input::placeholder { color: rgba(255,255,255,0.38); }

    .field-input:focus {
      border-color: #6bdfb8;
      background: rgba(255,255,255,0.13);
      box-shadow: 0 0 0 3px rgba(107,223,184,0.18);
    }

    .field-input:focus ~ .field-icon { color: #6bdfb8; }

    .toggle-pass {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(107,223,184,0.5);
      display: flex;
      align-items: center;
      padding: 0;
      transition: color 0.2s;
    }
    .toggle-pass:hover { color: #6bdfb8; }

    /* ── Forgot ── */
    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -6px;
    }

    .forgot-link {
      font-size: 12px;
      font-weight: 500;
      color: rgba(107,223,184,0.7);
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
      padding: 0;
      font-family: var(--font-body);
    }
    .forgot-link:hover { color: #6bdfb8; text-decoration: underline; }

    /* ── Submit button ── */
    .btn-submit {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #2ec4a9 0%, #1a9e8a 50%, #159d8a 100%);
      border: none;
      border-radius: 14px;
      padding: 14px 24px;
      color: #fff;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(46,196,169,0.4);
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      margin-top: 4px;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(46,196,169,0.55); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    /* ── Register link ── */
    .register-row {
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.48);
      font-family: var(--font-body);
    }

    .register-link {
      font-weight: 700;
      color: #6bdfb8;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      padding: 0;
      transition: opacity 0.2s;
    }
    .register-link:hover { text-decoration: underline; }

    /* ── Alert inline ── */
    .form-alert {
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 8px;
      animation: slide-up 0.3s ease-out;
    }
    /* A margem só existe quando o alerta aparece — escondido ele é
       `display: none` e não ocupa nada. Sem ela a caixa da mensagem
       encosta no que vier abaixo, que na tela de recuperação é a
       setinha de voltar. */
    .form-alert.show { display: flex; margin-bottom: 18px; }
    .form-alert.error   { background: rgba(255,107,107,0.12); border: 1px solid rgba(255,107,107,0.3); color: #ff8080; }
    .form-alert.success { background: rgba(107,223,184,0.14); border: 1px solid rgba(107,223,184,0.3); color: #6bdfb8; }

    /* ── Floating icons ── */
    .fi {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      color: rgba(107,223,184,0.22);
    }
    .fi-1  { top: 10%; left:  7%;  animation: float  6.0s ease-in-out infinite; }
    .fi-2  { top:  6%; left: 83%;  animation: float2 7.5s ease-in-out infinite; }
    .fi-3  { top: 70%; left:  5%;  animation: float  8.0s ease-in-out infinite 1s; }
    .fi-4  { top: 74%; left: 87%;  animation: float2 9.0s ease-in-out infinite 2s; }
    .fi-5  { top: 40%; left: 90%;  animation: float  5.5s ease-in-out infinite 0.5s; }
    .fi-6  { top: 88%; left: 50%;  animation: float2 10s  ease-in-out infinite 3s; }
    .fi-7  { top: 20%; left: 45%;  animation: float  7.0s ease-in-out infinite 1.5s; opacity: 0.12; }
    .fi-8  { top: 55%; left: 14%;  animation: float2 6.5s ease-in-out infinite 0.8s; opacity: 0.15; }

    /* ── Spinner ── */
    .spin {
      width: 17px; height: 17px;
      border: 2.5px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Cadastro ── */

    /* Esconde qualquer bloco. O JS põe e tira esta classe para alternar
       entre a tela de login e a de cadastro. */
    .hidden { display: none !important; }

    /* Botões "Sou Aluno" / "Sou Professor" */
    .role-toggle { display: flex; gap: 10px; }
    .role-option { flex: 1; position: relative; }
    .role-option input { display: none; }
    .role-label {
      display: flex; align-items: center; justify-content: center;
      width: 100%; padding: 12px; box-sizing: border-box;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: rgba(255,255,255,0.6);
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.25s;
    }
    .role-option input:checked + .role-label {
      background: rgba(107,223,184,0.15);
      border-color: #6bdfb8;
      color: #6bdfb8;
      box-shadow: 0 0 12px rgba(107,223,184,0.2);
    }

    /* Campos empilhados com o mesmo espaçamento do formulário */
    .field-group { display: flex; flex-direction: column; gap: 16px; }

    /* Dois campos lado a lado */
    .form-row { display: flex; gap: 12px; }
    .form-row > div { flex: 1; }

    /* Textinho de apoio embaixo de um campo */
    .field-hint {
      font-size: 12px; color: rgba(255,255,255,0.45);
      margin: 6px 0 0; min-height: 15px;
    }
    .field-hint.ok  { color: #6bdfb8; }
    .field-hint.err { color: #ff8080; }

    .mode-switch-row { display: flex; justify-content: flex-end; }

    /* Listas suspensas com a mesma aparência dos outros campos */
    select.field-input {
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2214%22%20height%3D%228%22%20viewBox%3D%220%200%2014%208%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M1%201L7%207L13%201%22%20stroke%3D%22%236bdfb8%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
      background-size: 12px;
      padding-right: 40px;
    }
    select.field-input option { background: #1a2332; color: #fff; }
    select.field-input:disabled { opacity: 0.45; cursor: not-allowed; }

    /* A idade é digitada, não incrementada com setinhas */
    input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    /* ── Recuperação de senha ── */
    .recuperar { display: flex; flex-direction: column; gap: 18px; }

    /* Cada passo é uma coluna com o mesmo respiro do formulário de
       login — sem isto os campos encostariam uns nos outros. */
    #rec-passo-codigo,
    #rec-passo-senha { display: flex; flex-direction: column; gap: 16px; }

    /* A setinha ocupa a própria linha, no canto esquerdo.
       Ela já foi `position: absolute`, e isso dava dois problemas: o
       título precisava de margem dos dois lados para desviar dela, o
       que o deixava torto, e quando o alerta verde aparecia acima do
       painel a setinha subia por cima dele. Fora do absolute, os dois
       somem — ninguém colide com quem está no fluxo. */
    .rec-voltar {
      align-self: flex-start;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 50%;
      color: rgba(255,255,255,0.75);
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .rec-voltar:hover {
      background: rgba(255,255,255,0.16);
      color: #fff;
      transform: translateX(-3px);
    }
    .rec-voltar:focus-visible { outline: 2px solid #6bdfb8; outline-offset: 2px; }

    /* Largura inteira do cartão: o título é a frase principal da tela
       e agora não divide a linha com nada. */
    .rec-titulo {
      font-size: 15.5px;
      font-weight: 600;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0 4px;
      line-height: 1.5;
    }

    /* Encosta no título de propósito: as duas frases são um bloco só,
       e o `gap` de 18px do painel as separaria demais. */
    .rec-sub {
      font-size: 12.5px;
      color: rgba(255,255,255,0.6);
      text-align: center;
      margin: -10px 0 0;
      line-height: 1.55;
      word-break: break-word;
    }
    .rec-sub strong { color: #6bdfb8; font-weight: 600; }

    /* ── Os cinco quadradinhos ── */
    .code-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 4px 0 2px;
    }

    .code-box {
      width: 52px;
      height: 60px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
      font-family: var(--font-body);
      text-transform: uppercase;
      color: #fff;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .code-box:focus {
      border-color: #6bdfb8;
      background: rgba(255,255,255,0.14);
      box-shadow: 0 0 0 3px rgba(107,223,184,0.18);
      transform: translateY(-2px);
    }
    /* Caixa preenchida fica acesa: a pessoa enxerga de relance quanto falta. */
    .code-box.cheia { border-color: rgba(107,223,184,0.55); background: rgba(107,223,184,0.10); }

    /* Código recusado: as cinco tremem juntas e voltam ao lugar. */
    .code-row.errou { animation: tremer 0.4s; }
    @keyframes tremer {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .rec-link {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 12.5px;
      font-family: var(--font-body);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 2px;
      align-self: center;
    }
    .rec-link:hover:not(:disabled) { color: #6bdfb8; }
    .rec-link:disabled { opacity: 0.45; cursor: default; text-decoration: none; }

    @media (max-width: 420px) {
      .code-box { width: 46px; height: 54px; font-size: 21px; }
      .code-row { gap: 7px; }
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .login-card { padding: 32px 22px 28px; }
      .logo-title { font-size: 22px; }
      .form-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Blobs de luz -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- Ícones flutuantes -->
  <div class="fi fi-1">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="currentColor">
      <rect x="9" y="2" width="6" height="20" rx="2"/>
      <rect x="2" y="9" width="20" height="6" rx="2"/>
    </svg>
  </div>
  <div class="fi fi-2">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </div>
  <div class="fi fi-3">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2L3 7v5c0 5.25 3.75 10.17 9 11.33C17.25 22.17 21 17.25 21 12V7l-9-5z"/>
    </svg>
  </div>
  <div class="fi fi-4">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
      <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
    </svg>
  </div>
  <div class="fi fi-5">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
      <path d="M4.22 11.29l6.36-6.36a5 5 0 0 1 7.07 7.07l-6.36 6.36a5 5 0 1 1-7.07-7.07z"/>
    </svg>
  </div>
  <div class="fi fi-6">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
      <rect x="9" y="2" width="6" height="20" rx="2"/>
      <rect x="2" y="9" width="20" height="6" rx="2"/>
    </svg>
  </div>
  <div class="fi fi-7">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </div>
  <div class="fi fi-8">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2L3 7v5c0 5.25 3.75 10.17 9 11.33C17.25 22.17 21 17.25 21 12V7l-9-5z"/>
    </svg>
  </div>

  <!-- Página de login -->
  <main class="login-page">
    <div class="login-card">

      <!-- Logo -->
      <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:28px;">
        <div class="logo-icon-wrap">
          <div class="logo-ring"></div>
          <!-- Coração animado -->
          <svg width="38" height="38" viewBox="0 0 24 24" fill="#fff">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>

        <h1 class="logo-title">HERÓIS DA SAÚDE</h1>
        <p class="logo-sub" id="logo-sub">Sua missão de saúde começa aqui</p>

        <!-- ECG animado — ritmo sinusal normal, redesenhado sem parar
             Este traçado já foi uma linha reta com espetos soltos, e a
             equipe de Medicina reconheceu nele um ritmo agônico: sem
             onda P, sem onda T e com os batimentos em intervalos
             desiguais. Era o eletro de quem está morrendo, na tela de
             abertura de um jogo sobre cuidar da saúde.

             Cada batimento agora tem as cinco partes, na proporção
             certa — P pequena, QRS alto e estreito, T arredondada e
             maior que a P — e os três saem de 88 em 88 unidades, que
             é o que faz um ritmo ser "regular".

             O desenho cabe inteiro na janela de propósito: quem se
             move aqui é a caneta, não o papel. Ver o CSS de .ecg-path. -->
        <div class="ecg-wrap">
          <svg viewBox="0 0 280 40" fill="none" width="100%" preserveAspectRatio="none">
            <path
              class="ecg-path"
              d="M 0,20 L 6,20
                 L 14,20  Q 20,12 26,20   L 32,20
                 L 34,23  L 38,2  L 42,28 L 45,20
                 L 51,20  Q 60,6 69,20    L 94,20
                 L 102,20 Q 108,12 114,20 L 120,20
                 L 122,23 L 126,2 L 130,28 L 133,20
                 L 139,20 Q 148,6 157,20  L 182,20
                 L 190,20 Q 196,12 202,20 L 208,20
                 L 210,23 L 214,2 L 218,28 L 221,20
                 L 227,20 Q 236,6 245,20  L 280,20"
              stroke="#6bdfb8"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
          </svg>
        </div>
      </div>

      <!-- Alerta de feedback -->
      <div class="form-alert" id="form-alert" role="alert"></div>

      <!-- Formulário -->
      <form class="form" id="login-form" novalidate>

        <!-- Sou Aluno / Sou Professor — só aparece no cadastro -->
        <div id="box-role" class="role-toggle hidden">
          <label class="role-option">
            <input type="radio" name="tipo" value="ALUNO" checked>
            <span class="role-label">Sou Aluno</span>
          </label>
          <label class="role-option">
            <input type="radio" name="tipo" value="PROFESSOR">
            <span class="role-label">Sou Professor</span>
          </label>
        </div>

        <!-- Nome — só aparece no cadastro -->
        <div id="box-nome" class="hidden">
          <label class="field-label" for="nome">Nome Completo</label>
          <div class="field-wrap">
            <input class="field-input" type="text" id="nome" name="nome"
                   placeholder="Seu nome real" autocomplete="name" />
            <span class="field-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- E-mail -->
        <div>
          <label class="field-label" for="email">E-mail</label>
          <div class="field-wrap">
            <input
              class="field-input"
              type="email"
              id="email"
              name="email"
              placeholder="heroi@saude.com"
              autocomplete="email"
              required
            />
            <span class="field-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
          </div>
          <p class="field-hint hidden" id="email-hint"></p>
        </div>

        <!-- Senha -->
        <div>
          <label class="field-label" for="password">Senha</label>
          <div class="field-wrap">
            <input
              class="field-input"
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <span class="field-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Mostrar senha">
              <!-- ícone eye (padrão) -->
              <svg id="eye-open" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- ícone eye-off (oculto por padrão) -->
              <svg id="eye-closed" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Campos do ALUNO — só aparecem no cadastro -->
        <div id="box-aluno" class="field-group hidden">

          <!-- Idade digitada e validada no JS (7 a 18, faixa do jogo) -->
          <div>
            <label class="field-label" for="idade">Idade</label>
            <div class="field-wrap">
              <input class="field-input" type="number" id="idade" name="idade"
                     min="7" max="18" step="1" inputmode="numeric" placeholder="Ex: 12" />
              <span class="field-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              </span>
            </div>
            <p class="field-hint" id="idade-hint"></p>
          </div>

          <!-- Modo A: escolhe a escola e só então as turmas dela aparecem -->
          <div id="modo-selecao" class="field-group">
            <div>
              <label class="field-label" for="escola-aluno">Escola</label>
              <div class="field-wrap">
                <select class="field-input" id="escola-aluno" name="escola_aluno">
                  <option value="" disabled selected>Carregando escolas...</option>
                </select>
                <span class="field-icon">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                </span>
              </div>
            </div>
            <div>
              <label class="field-label" for="turma">Turma</label>
              <div class="field-wrap">
                <select class="field-input" id="turma" name="turma" disabled>
                  <option value="" disabled selected>Selecione a escola primeiro</option>
                </select>
                <span class="field-icon">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                </span>
              </div>
            </div>
          </div>

          <!-- Modo B: código que o professor entrega para a sala -->
          <div id="modo-codigo" class="hidden">
            <label class="field-label" for="codigo-turma">Código da turma</label>
            <div class="field-wrap">
              <input class="field-input" type="text" id="codigo-turma" name="codigo_turma"
                     placeholder="Ex: 7B-K3M9" maxlength="12" autocomplete="off" />
              <span class="field-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
              </span>
            </div>
            <p class="field-hint" id="codigo-hint">Peça o código ao seu professor.</p>
          </div>

          <div class="mode-switch-row">
            <button type="button" class="forgot-link" id="btn-modo-turma">Tenho um código da turma</button>
          </div>
        </div>

        <!-- Campos do PROFESSOR — só aparecem no cadastro -->
        <div id="box-professor" class="field-group hidden">
          <div>
            <label class="field-label" for="escola">Escola de Atuação</label>
            <div class="field-wrap">
              <select class="field-input" id="escola" name="escola">
                <option value="" disabled selected>Carregando escolas...</option>
              </select>
              <span class="field-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              </span>
            </div>
          </div>

          <!-- Aparece só ao escolher "+ Cadastrar Nova Escola" -->
          <div id="box-nova-escola" class="hidden">
            <label class="field-label" for="nova-escola">Nome da nova escola</label>
            <div class="field-wrap">
              <input class="field-input" type="text" id="nova-escola" name="nova_escola"
                     placeholder="Ex: Colégio Santa Maria" maxlength="150" />
              <span class="field-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              </span>
            </div>
            <p class="field-hint">Depois de criar a conta, cadastre as turmas no seu painel.</p>
          </div>
        </div>

        <!-- Esqueci senha — só no login -->
        <div class="forgot-row" id="forgot-row">
          <button type="button" class="forgot-link" id="forgot-btn">Esqueci minha senha</button>
        </div>

        <!-- Botão entrar -->
        <button type="submit" class="btn-submit" id="submit-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="rgba(255,255,255,0.85)">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span id="btn-label">Entrar no Jogo</span>
          <span class="spin" id="btn-spin"></span>
        </button>

      </form>

      <!-- ── Recuperação de senha ──────────────────────────────────
           Três telas no mesmo lugar, trocadas pelo auth.js: pedir o
           código, digitar os cinco caracteres, escolher a nova senha.
           O formulário de login fica escondido enquanto isto aparece. -->
      <div class="recuperar hidden" id="recuperar">

        <button type="button" class="rec-voltar" id="rec-voltar" aria-label="Voltar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
        </button>

        <!-- Passo 1 de 2: o código -->
        <div id="rec-passo-codigo" class="hidden">
          <p class="rec-titulo">Insira o código de 5 dígitos enviado para seu e-mail</p>
          <p class="rec-sub">Enviamos para <strong id="rec-email"></strong>. Ele vale por 10 minutos.</p>

          <div class="code-row" id="code-row" role="group"
               aria-label="Código de cinco caracteres">
            <input class="code-box" type="text" inputmode="text" maxlength="1"
                   autocomplete="one-time-code" autocapitalize="characters"
                   spellcheck="false" aria-label="Caractere 1 de 5" />
            <input class="code-box" type="text" inputmode="text" maxlength="1"
                   autocomplete="off" autocapitalize="characters"
                   spellcheck="false" aria-label="Caractere 2 de 5" />
            <input class="code-box" type="text" inputmode="text" maxlength="1"
                   autocomplete="off" autocapitalize="characters"
                   spellcheck="false" aria-label="Caractere 3 de 5" />
            <input class="code-box" type="text" inputmode="text" maxlength="1"
                   autocomplete="off" autocapitalize="characters"
                   spellcheck="false" aria-label="Caractere 4 de 5" />
            <input class="code-box" type="text" inputmode="text" maxlength="1"
                   autocomplete="off" autocapitalize="characters"
                   spellcheck="false" aria-label="Caractere 5 de 5" />
          </div>

          <button type="button" class="btn-submit" id="rec-conferir">
            <span id="rec-conferir-label">Confirmar código</span>
            <span class="spin" id="rec-conferir-spin"></span>
          </button>

          <button type="button" class="rec-link" id="rec-reenviar">Enviar outro código</button>
        </div>

        <!-- Passo 2 de 2: a nova senha -->
        <div id="rec-passo-senha" class="hidden">
          <p class="rec-titulo">Escolha sua nova senha</p>

          <div>
            <label class="field-label" for="rec-senha">Nova senha</label>
            <div class="field-wrap">
              <input class="field-input" type="password" id="rec-senha"
                     placeholder="Pelo menos 6 caracteres" autocomplete="new-password" />
              <span class="field-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
            </div>
          </div>

          <div>
            <label class="field-label" for="rec-senha2">Confirmação de senha</label>
            <div class="field-wrap">
              <input class="field-input" type="password" id="rec-senha2"
                     placeholder="Digite de novo" autocomplete="new-password" />
              <span class="field-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 6L9 17l-5-5"/>
                </svg>
              </span>
            </div>
          </div>

          <button type="button" class="btn-submit" id="rec-alterar">
            <span id="rec-alterar-label">Alterar</span>
            <span class="spin" id="rec-alterar-spin"></span>
          </button>
        </div>

      </div>

      <!-- Divisor -->
      <div class="divider" id="login-divider" style="margin:20px 0 16px"><span>ou</span></div>

      <!-- Alterna entre login e cadastro -->
      <p class="register-row">
        <span id="toggle-text">Novo herói?</span>
        <button type="button" class="register-link" id="register-btn">Criar conta gratuita</button>
      </p>

    </div>
  </main>

  <script src="/vendor/supabase.js"></script>
  <script src="../js/supabase.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/auth.js" defer></script>

</body>
</html>
