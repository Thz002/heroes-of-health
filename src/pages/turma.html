<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turma - Heróis da Saúde</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script src="/vendor/supabase.js"></script>
  <script src="../js/supabase.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/navbar.js" defer></script>
  <script src="../js/turma.js" defer></script>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="fundo-vivo" aria-hidden="true">
    <span style="--x:12%; --tam:12px; --dur:22s; --atraso:0s"></span>
    <span style="--x:33%; --tam:8px;  --dur:26s; --atraso:5s"></span>
    <span style="--x:59%; --tam:16px; --dur:18s; --atraso:2s"></span>
    <span style="--x:78%; --tam:10px; --dur:24s; --atraso:9s"></span>
  </div>

  <div class="page-wrap">

    <!-- A barra inteira é desenhada pelo navbar.js: links, selo de XP e o
         botão Sair. Para mudar o menu, é a lista no topo daquele arquivo. -->
    <nav class="nav_bar" data-navbar></nav>

    <main class="main-content">

      <div class="turma-topo">
        <a class="turma-topo__voltar" href="dashboard.html">&#8592; Minhas turmas</a>

        <div class="turma-topo__linha">
          <div>
            <h2 class="turma-topo__nome" id="turma-nome">—</h2>
            <p class="turma-topo__ano" id="turma-ano">—</p>
          </div>

          <div class="turma-topo__dados">
            <div class="dado">
              <span class="dado__num" id="turma-alunos">0/10</span>
              <span class="dado__rot">alunos</span>
            </div>
            <div class="dado">
              <span class="dado__num" id="turma-codigo">-</span>
              <span class="dado__rot">código</span>
            </div>
          </div>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="col-full">

          <section class="dashboard-section">
            <h3>Ranking da turma</h3>
          </section>

          <section class="painel">

            <div class="rank__cabecalho">
              <span>#</span>
              <span>Aluno</span>
              <span>Progresso</span>
              <span class="rank__pontos-rotulo">Acertos</span>
            </div>

            <ol class="rank" id="lista-rank">

            </ol>

            <!-- Aparece quando a turma ainda não tem aluno nenhum. -->
            <div class="empty-state" id="empty-rank" hidden>
              <div class="empty-state__icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                </svg>
              </div>
              <p class="empty-state__title">Nenhum aluno entrou ainda</p>
              <p class="empty-state__hint">Entregue o código da turma para a sala.</p>
            </div>

          </section>
        </div>
      </div>
    </main>
  </div>
</body>

</html>
