<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus quizes - Heróis da Saúde</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script src="/vendor/supabase.js"></script>
  <script src="../js/supabase.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/navbar.js" defer></script>
  <script src="../js/quizzes.js" defer></script>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="fundo-vivo" aria-hidden="true">
    <span style="--x:14%; --tam:12px; --dur:23s; --atraso:0s"></span>
    <span style="--x:41%; --tam:8px;  --dur:27s; --atraso:6s"></span>
    <span style="--x:64%; --tam:16px; --dur:19s; --atraso:3s"></span>
    <span style="--x:86%; --tam:10px; --dur:25s; --atraso:10s"></span>
  </div>

  <div class="page-wrap">

    <nav class="nav_bar">
      <div class="topLine">
        <div class="navbar__inner">
          <div class="navbar__logo">
            <div class="navbar__logo-dot">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff">
                <path
                  d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
              </svg>
            </div>
            HERÓIS DA SAÚDE
          </div>

          <div style="display:flex;align-items:center;gap:20px;">
            <!-- data-perfil diz para quem cada link existe. Quem cumpre a
                 regra é o navbar.js, que roda em todas as páginas. -->
            <ul class="navbar__links">
              <li data-perfil="PROFESSOR"><a href="dashboard.html">Turmas</a></li>
              <li data-perfil="PROFESSOR"><a href="quizzes.html" class="navbar__ativo">Quizes</a></li>
              <li data-perfil="ALUNO"><a href="mapa.html">Mapa</a></li>
              <li data-perfil="ALUNO"><a href="missao.html">Missões</a></li>
              <li data-perfil="PROFESSOR ALUNO"><a href="ranking.html">Ranking</a></li>
            </ul>

            <button id="logout-btn" class="btn-logout">Sair</button>
          </div>
        </div>
      </div>
    </nav>

    <main class="main-content">

      <div class="welcome-bar">
        <div class="welcome-text">
          <h2>Meus quizes</h2>
          <p id="quizzes-subtitulo">Tudo o que você já passou para as suas turmas.</p>
        </div>
        <div class="welcome-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#f9c74f">
            <path d="M12 2L3 7v5c0 5.25 3.75 10.17 9 11.33C17.25 22.17 21 17.25 21 12V7l-9-5z" />
          </svg>
          <span><span id="quizzes-total">0</span> quizes criados</span>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="col-full">

          <section class="dashboard-section">
            <h3>Histórico</h3>
          </section>

          <section class="painel">

            <div class="lista-quizzes" id="lista-quizzes"></div>

            <div class="empty-state" id="empty-quizzes" hidden>
              <div class="empty-state__icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round">
                  <circle cx="12" cy="12" r="9" />
                  <path d="M9.2 9a2.9 2.9 0 0 1 5.6 1c0 2-2.8 2.4-2.8 4" />
                  <path d="M12 17.5h.01" />
                </svg>
              </div>
              <p class="empty-state__title">Nenhum quiz criado ainda</p>
              <p class="empty-state__hint">
                No painel de turmas, clique num card e escolha “Criar quiz”.
              </p>
            </div>

          </section>
        </div>
      </div>
    </main>
  </div>

  <!-- Confirmação antes de apagar um quiz — é ação sem volta. -->
  <div class="modal" id="modal-apagar" hidden>
    <div class="modal__caixa modal__caixa--estreita" role="dialog" aria-labelledby="apagar-titulo">
      <div class="modal-header">
        <h3 id="apagar-titulo">Apagar quiz</h3>
        <button class="modal__fechar" id="apagar-fechar" aria-label="Fechar">&times;</button>
      </div>

      <p class="modal__texto" id="apagar-texto"></p>
      <p class="modal__erro" id="apagar-erro" hidden></p>

      <div class="modal__acoes">
        <button class="btn-ghost" id="apagar-nao">Manter</button>
        <button class="btn-perigo" id="apagar-sim">Apagar</button>
      </div>
    </div>
  </div>
</body>

</html>
