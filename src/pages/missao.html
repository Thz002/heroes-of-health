<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missão - Heróis da Saúde</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/missao.css">
  <script src="/vendor/supabase.js"></script>
  <script src="../js/supabase.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/navbar.js" defer></script>
  <script src="../js/quiz.js" defer></script>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="page-wrap">

    <!-- A barra inteira é desenhada pelo navbar.js: links, selo de XP e o
         botão Sair. Para mudar o menu, é a lista no topo daquele arquivo. -->
    <nav class="nav_bar" data-navbar></nav>

    <main class="main-content">

      <!-- Cabeçalho da missão: nome do lugar, título e o quanto falta -->
      <div class="turma-topo" id="missao-topo" hidden>
        <div class="turma-topo__linha">
          <div>
            <h2 class="turma-topo__nome" id="missao-titulo">—</h2>
            <p class="turma-topo__ano" id="missao-descricao">—</p>
          </div>

          <div class="turma-topo__dados">
            <div class="dado">
              <span class="dado__num" id="missao-passo">—</span>
              <span class="dado__rot">desta rodada</span>
            </div>
            <div class="dado">
              <span class="dado__num" id="missao-restantes">—</span>
              <span class="dado__rot">a responder</span>
            </div>

            <!-- Só aparece em tarefa da professora: é ela quem define o
                 tempo de cada pergunta. Na exploração livre não há relógio. -->
            <div class="dado dado--tempo" id="missao-cronometro" hidden>
              <span class="dado__num" id="missao-tempo">--</span>
              <span class="dado__rot">nesta pergunta</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Enquanto carrega / quando dá erro / quando não há mais nada -->
      <section class="painel" id="missao-aviso">
        <div class="empty-state">
          <p class="empty-state__title" id="aviso-titulo">Carregando…</p>
          <p class="empty-state__hint" id="aviso-texto"></p>
          <p id="aviso-acoes" style="margin-top:18px;" hidden>
            <a class="btn-primary" href="mapa.html">Voltar ao mapa</a>
          </p>
        </div>
      </section>

      <!-- A questão da vez, com o lugar e as ações ao lado -->
      <div class="missao-jogo" id="quiz" hidden>
        <section class="quiz-card missao-perguntas">
          <!-- A barra encolhe junto com o tempo. O número já está no topo;
               a barra é para quem está lendo a pergunta e não olha para lá. -->
          <div class="quiz-tempo" id="quiz-tempo-barra" hidden><i></i></div>

          <p class="quiz-question" id="quiz-enunciado"></p>

          <div class="quiz-options" id="quiz-opcoes"></div>

          <!-- Fica visível depois de confirmar -->
          <div id="quiz-retorno" hidden style="margin-top:20px;">
            <p id="quiz-explicacao" style="font-size:14.5px;line-height:1.6;"></p>
            <p id="quiz-pontos" style="margin-top:10px;font-size:14px;"></p>
            <button class="btn-primary" id="quiz-continuar" style="margin-top:16px;">Continuar</button>
          </div>
        </section>

        <aside class="missao-lateral">
          <div class="missao-lateral__foto" id="missao-foto">
            <img class="missao-lateral__interior" id="missao-interior" alt="" hidden>
            <img class="missao-lateral__familia" id="missao-familia" alt="" hidden>
          </div>

          <a class="btn-ghost missao-lateral__btn" href="mapa.html">Voltar ao mapa</a>
          <button class="btn-primary missao-lateral__btn" id="quiz-confirmar" type="button" disabled>
            Escolha uma alternativa
          </button>
        </aside>
      </div>

      <!-- Fim da rodada -->
      <section class="painel" id="fim" hidden>
        <div class="empty-state">
          <p class="empty-state__title">Rodada concluída!</p>
          <p class="empty-state__hint" id="fim-placar"></p>
          <div id="fim-barras" style="margin-top:18px;"></div>
          <p style="margin-top:20px;display:flex;gap:10px;justify-content:center;">
            <a class="btn-primary" href="mapa.html">Voltar ao mapa</a>
            <button class="btn-ghost" id="fim-continuar" hidden>Fazer mais uma rodada</button>
          </p>
        </div>
      </section>

    </main>
  </div>
</body>

</html>
