<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome! - Start Menu</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/supabase.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>

    <style>
        .page-main {
            min-height: 100vh;
            display: grid;
            place-items: center;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: min(260px, 80vw);
        }
        .menu__logo {
            text-align: center;
            margin-bottom: 38px;
        }
        .menu__acoes {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 34px;
        }
        .menu__emblema {
            display: inline-grid;
            place-items: center;
            width: 82px;
            height: 82px;
            font-size: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.14);
            margin-bottom: 18px;
            animation: flutuar 3s ease-in-out infinite;
        }
        .menu__btn {
            width: 100%;
            padding: 15px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: transform .16s, background .16s, border-color .16s;
        }
        .menu__btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.11);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .menu__btn:active {
            transform: translateY(0);
        }
        .menu__btn--primario {
            background: var(--cor-primaria, #14b8a6);
            border-color: transparent;
            color: #05201d;
        }
        .menu__btn--primario:hover {
            background: var(--cor-primaria, #14b8a6);
            filter: brightness(1.08);
        }
        .menu__titulo {
            font-family: var(--font-display);
            font-size: clamp(38px, 9vw, 58px);
            font-weight: 900;
            line-height: 0.92;
            color: #fff;
            margin: 0;
            letter-spacing: -0.02em;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }
        .menu__titulo span {
            color: var(--gold, #f9c74f);
        }
        .menu__tagline {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin: 14px 0 0;
        }
        @keyframes surgir {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes flutuar {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }
        .menu__logo {
            animation: surgir .6s ease both;
        }
        .menu__acoes {
            animation: surgir .6s ease .25s both;
        }
    </style>
</head>
<body>
    <main class="page-main">
        <div class="menu">
            <div class="menu__logo">
                <span class="menu__emblema">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff">
                        <path
                            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                    </svg>
                </span>
                <h1 class="menu__titulo">Heróis<br><span>da Saúde</span></h1>
                <p class="menu__tagline">Salve o bairro, aprenda sobre saúde!</p>
            </div>
            <div class="menu__acoes">
                <button class="menu__btn menu__btn--primario">▶ Jogar</button>
                <button class="menu__btn">Opções</button>
            </div>
        </div>
    </main>
</body>
</html>
