<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Heróis da Saúde">
  <title>Heróis da Saúde</title>

  <!--
    O mesmo emblema da barra de navegação: quadrado de canto arredondado
    com o degradê da paleta (--primary → --primary-dark) e o coração
    branco no meio.

    Uma diferença de propósito: aqui o coração é maior que na navbar
    (57% da largura, contra 47%). Numa aba de navegador o ícone chega a
    16 pixels, e na proporção da barra o coração virava um risco fino
    que não se reconhecia. O contorno é o mesmo; só o peso muda.

    O degradê a 55° é o equivalente em SVG do linear-gradient(145deg)
    do CSS — o ângulo do CSS conta a partir de cima, o do SVG a partir
    da horizontal.
  -->

  <defs>
    <linearGradient id="verde" x1="0" y1="0" x2="0.574" y2="0.819">
      <stop offset="0" stop-color="#2ec4a9"/>
      <stop offset="1" stop-color="#1a9e8a"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="10" fill="url(#verde)"/>

  <path transform="translate(4.96 4.79) scale(0.92)" fill="#ffffff"
        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
</svg>
